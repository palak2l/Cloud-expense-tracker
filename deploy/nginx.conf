# Replace YOUR_EC2_PUBLIC_DNS_OR_DOMAIN before enabling this site.
# Copy to: /etc/nginx/sites-available/expense-tracker
# Enable with: sudo ln -s /etc/nginx/sites-available/expense-tracker /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_EC2_PUBLIC_DNS_OR_DOMAIN;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
    }
}

# After you attach a certificate with Certbot, COOKIE_SECURE=true in /etc/expense-tracker.env
# and APP_ORIGIN=https://YOUR_DOMAIN.
